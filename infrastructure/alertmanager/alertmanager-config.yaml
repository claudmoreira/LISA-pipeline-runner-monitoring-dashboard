apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
  namespace: scientific-workflow
spec:
  route:
    receiver: 'email-alerts'
    groupBy: ['alertname', 'namespace', 'pod']
    groupWait: 30s        # aguarda 30s antes de enviar o primeiro email do grupo
    groupInterval: 5m     # aguarda 5m antes de enviar novos alertas do mesmo grupo
    repeatInterval: 4h    # reenvia o alerta se ainda estiver ativo após 4h
    routes:
      # Rota para alertas críticos
      - matchers:
          - name: severity
            value: critical
        receiver: 'email-alerts-critical'
        repeatInterval: 1h  # critical: reenvia mais frequentemente

      # Rota para alertas de aviso
      - matchers:
          - name: severity
            value: warning
        receiver: 'email-alerts-warning'
        repeatInterval: 2h  # warning: reenvia menos frequentemente

  receivers:
    - name: 'email-alerts'
      emailConfigs:
        - to: 'up202107100@g.uporto.pt'
          from: 'lisamonitoringdashboard@gmail.com'
          smarthost: 'smtp.gmail.com:587'
          authUsername: 'lisamonitoringdashboard@gmail.com'
          authPassword:
            secret:
              name: alertmanager-smtp-secret # TODO: check se o nome do secret está correto
              key: password
          requireTLS: true
          sendResolved: true  # envia email também quando o alerta é resolvido
          headers:
            Subject: '[LISA] {{ .Status | toUpper }} - {{ .CommonLabels.alertname }}'
          html: |
            <h2>LISA Pipeline Runner - {{ .Status | toUpper }}</h2>
            {{ range .Alerts }}
            <hr>
            <b>Alert:</b> {{ .Labels.alertname }}<br>
            <b>Severity:</b> {{ .Labels.severity }}<br>
            <b>Namespace:</b> {{ .Labels.namespace }}<br>
            <b>Pod:</b> {{ .Labels.pod }}<br>
            <b>Description:</b> {{ .Annotations.description }}<br>
            <b>Start Time:</b> {{ .StartsAt }}<br>
            {{ end }}

    - name: 'email-alerts-critical'
      emailConfigs:
        - to: 'up202107100@g.uporto.pt'
          from: 'lisamonitoringdashboard@gmail.com'
          smarthost: 'smtp.gmail.com:587'
          authUsername: 'lisamonitoringdashboard@gmail.com'
          authPassword:
            secret:
              name: alertmanager-smtp-secret # TODO: check se o nome do secret está correto
              key: password
          requireTLS: true
          sendResolved: true
          headers:
            Subject: '[LISA] 🔴 CRITICAL - {{ .CommonLabels.alertname }}'
          html: |
            <h2 style="color:red;">⚠️ CRITICAL ALERT - LISA Pipeline Runner</h2>
            {{ range .Alerts }}
            <hr>
            <b>Alert:</b> {{ .Labels.alertname }}<br>
            <b>Pod:</b> {{ .Labels.pod }}<br>
            <b>Description:</b> {{ .Annotations.description }}<br>
            <b>Start Time:</b> {{ .StartsAt }}<br>
            {{ end }}

    - name: 'email-alerts-warning'
      emailConfigs:
        - to: 'up202107100@g.uporto.pt'
          from: 'lisamonitoringdashboard@gmail.com'
          smarthost: 'smtp.gmail.com:587'
          authUsername: 'lisamonitoringdashboard@gmail.com'
          authPassword:
            secret:
              name: alertmanager-smtp-secret
              key: password
          requireTLS: true
          sendResolved: true
          headers:
            Subject: '[LISA] ⚠️ WARNING - {{ .CommonLabels.alertname }}'
          html: |
            <h2 style="color:orange;">⚠️ WARNING ALERT - LISA Pipeline Runner</h2>
            {{ range .Alerts }}
            <hr>
            <b>Alert:</b> {{ .Labels.alertname }}<br>
            <b>Severity:</b> {{ .Labels.severity }}<br>
            <b>Pod:</b> {{ .Labels.pod }}<br>
            <b>Description:</b> {{ .Annotations.description }}<br>
            <b>Start Time:</b> {{ .StartsAt }}<br>
            {{ end }}

