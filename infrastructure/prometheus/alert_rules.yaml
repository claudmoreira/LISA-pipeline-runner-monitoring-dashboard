apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lisa-workflow-alerts
  namespace: scientific-workflow
spec:
  groups:
    - name: lisa.workflow.alerts
      interval: 30s
      rules:
        # ========================================
        # CRITICAL ALERTS
        # ========================================

        # Alert when system/critical service is down
        - alert: SystemDown
          expr: up{job=~"argo-workflow-controller|backend|prometheus"} == 0
          for: 2m
          labels:
            severity: critical
            service: "{{ $labels.job }}"
          annotations:
            summary: "System critical is down: {{ $labels.job }}"
            description: "The service {{ $labels.job }} is unavailable for more than 2 minutes."

        # Alert when workflow terminates with OOMKilled
        - alert: WorkflowOOMKilled
          expr: increase(kube_pod_container_status_terminated_reason{reason="OOMKilled", container="main", namespace="scientific-workflow"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
            workflow_status: "oom_killed"
          annotations:
            summary: "Workflow ended due to memory exhaustion (OOMKilled)"
            description: "The workflow in pod {{ $labels.pod }} was terminated due to memory exhaustion (OOMKilled)."

        # ========================================
        # WARNING ALERTS
        # ========================================

        # Alert when CPU usage is above 95%
        - alert: HighCPUUsage
          expr: |
            (
              100 * rate(container_cpu_usage_seconds_total{
                container="main",
                namespace="scientific-workflow",
                pod=~"lisa-workflow-.*"
              }[2m])
            ) / on(pod, namespace)
            kube_pod_container_resource_limits{
              container="main",
              resource="cpu",
              namespace="scientific-workflow",
              pod=~"lisa-workflow-.*"
            } >= 0.95
          for: 5m
          labels:
            severity: warning
            resource: "cpu"
          annotations:
            summary: "CPU above 95% in workflow {{ $labels.pod }}"
            description: "The pod {{ $labels.pod }} is using {{ printf \"%.2f\" $value }}% of its CPU limit."

        # Alert when Memory usage is above 95%
        - alert: HighMemoryUsage
          expr: |
            (
              100 * container_memory_usage_bytes{
                container="main",
                namespace="scientific-workflow",
                pod=~"lisa-workflow-.*"
              }
            ) / on(pod, namespace)
            kube_pod_container_resource_limits{
              container="main",
              resource="memory",
              unit="byte",
              namespace="scientific-workflow",
              pod=~"lisa-workflow-.*"
            } >= 0.95
          for: 5m
          labels:
            severity: warning
            resource: "memory"
          annotations:
            summary: "Memory above 95% in workflow {{ $labels.pod }}"
            description: "The pod {{ $labels.pod }} is using {{ printf \"%.2f\" $value }}% of its memory limit."

        # Alert when workflow terminates with Error
        - alert: WorkflowFailed
          expr: increase(kube_pod_container_status_terminated_reason{reason="Error", container="main", namespace="scientific-workflow"}[5m]) > 0
          for: 1m
          labels:
            severity: warning
            workflow_status: "failed"
          annotations:
            summary: "Workflow failed"
            description: "The workflow in pod {{ $labels.pod }} failed."
