name: Manual Alert Sender

on:
  workflow_dispatch:
    inputs:
      alertmanager_url:
        description: 'Alertmanager URL (optional, overrides repository secret)'
        required: false
        default: ''
      alertname:
        description: 'Alert name'
        required: false
        default: 'WorkflowFailed'
      severity:
        description: 'Alert severity'
        required: false
        default: 'warning'
      reason:
        description: 'Failure reason'
        required: false
        default: 'Error'
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'scientific-workflow'
      pod:
        description: 'Pod name'
        required: false
        default: 'manual-trigger'
      description:
        description: 'Alert description'
        required: false
        default: 'Manual trigger: workflow failed with reason Error'

jobs:
  send-alert:
    runs-on: ubuntu-latest
    env:
      ALERTMANAGER_URL_SECRET: ${{ secrets.ALERTMANAGER_URL }}
      ALERTNAME: ${{ github.event.inputs.alertname }}
      SEVERITY: ${{ github.event.inputs.severity }}
      REASON: ${{ github.event.inputs.reason }}
      NAMESPACE: ${{ github.event.inputs.namespace }}
      POD: ${{ github.event.inputs.pod }}
      ANN_DESC: ${{ github.event.inputs.description }}
      ALERTMANAGER_URL_INPUT: ${{ github.event.inputs.alertmanager_url }}
    steps:
      - name: Build and post alert
        run: |
          set -euo pipefail
          ALERT_URL="${ALERTMANAGER_URL_INPUT}"
          if [ -z "$ALERT_URL" ]; then
            ALERT_URL="${ALERTMANAGER_URL_SECRET}"
          fi
          if [ -z "$ALERT_URL" ]; then
            echo "ERROR: No Alertmanager URL provided. Set repository secret ALERTMANAGER_URL or provide input." >&2
            exit 1
          fi

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > alert.json <<EOF
          [
            {
              "labels": {
                "alertname": "${ALERTNAME}",
                "severity": "${SEVERITY}",
                "workflow_status": "failed",
                "reason": "${REASON}",
                "namespace": "${NAMESPACE}",
                "pod": "${POD}"
              },
              "annotations": {
                "description": "${ANN_DESC}",
                "triggered_by": "github-actions"
              },
              "startsAt": "${NOW}"
            }
          ]
          EOF

          echo "Posting alert to $ALERT_URL"
          curl -s -XPOST -H "Content-Type: application/json" --data-binary @alert.json "$ALERT_URL"
          echo "Posted."
